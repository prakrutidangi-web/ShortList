services:
  db:
    image: pgvector/pgvector:pg16 # multi-arch (works on Apple Silicon)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shortlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortlist_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-shortlist}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shortlist}:${POSTGRES_PASSWORD:-shortlist_dev_only}@db:5432/${POSTGRES_DB:-shortlist}
      CORS_ORIGINS: '["http://localhost:${WEB_HOST_PORT:-3000}"]'
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # OPT-IN (profile "ml"): API image WITH torch + sentence-transformers (CPU only: Docker on macOS cannot use the Apple
  # GPU, so prefer `make dev` for speed). Different host port so it never clashes with the slim `api`:
  #   docker compose --profile ml up -d --build api-ml     (then point NEXT_PUBLIC_API_URL at :8002)
  api-ml:
    profiles: ["ml"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        WITH_ML: "1"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shortlist}:${POSTGRES_PASSWORD:-shortlist_dev_only}@db:5432/${POSTGRES_DB:-shortlist}
      CORS_ORIGINS: '["http://localhost:${WEB_HOST_PORT:-3000}"]'
      EMBEDDING_DEVICE: cpu
      HF_HOME: /models
    ports:
      - "${API_ML_HOST_PORT:-8002}:8000"
    volumes:
      - hfcache:/models
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: apps/web
    environment:
      API_URL: http://api:8000
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - api

  # OFF by default. Enable with: docker compose --profile scheduler up -d scheduler
  # (run `make migrate` first). Alternative: plain cron, e.g. in your crontab (06:00 daily):
  #   0 6 * * * cd /path/to/repo && TZ=America/Phoenix make ingest >> data/ingest.log 2>&1
  scheduler:
    profiles: ["scheduler"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "shortlist_ml.ingest", "schedule", "--at", "06:00"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shortlist}:${POSTGRES_PASSWORD:-shortlist_dev_only}@db:5432/${POSTGRES_DB:-shortlist}
      TIMEZONE: ${TIMEZONE:-America/Phoenix}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-14}
    volumes:
      - ./companies.yaml:/app/companies.yaml:ro
      - ./data/raw:/app/data/raw
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  hfcache:
