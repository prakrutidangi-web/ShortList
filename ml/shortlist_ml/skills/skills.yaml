# Curated skill dictionary (Phase 2, v0). Hand-written; matching is regex-based with word boundaries.
#   aliases     case-insensitive strings
#   cs          case-sensitive strings (ambiguous words such as "React", "Swift", "Julia")
#   regex       raw case-insensitive regexes for context-gated names ("Go", "R", "C")
# A name with only a few spellings is intentional: precision over recall. Gaps are measured in
# docs/skills-labels.csv and docs/skills-eval.md.

# ---- languages
- {name: Python, category: language, aliases: [python, python3, pyspark]}
- {name: Java, category: language, aliases: [java]}
- {name: JavaScript, category: language, aliases: [javascript, ecmascript, "es6"]}
- {name: TypeScript, category: language, aliases: [typescript]}
- {name: "C++", category: language, aliases: ["c++", "c/c++", "cpp"]}
- {name: C, category: language, regex: ['\bC\s*/\s*C\+\+', '\bC\s+and\s+C\+\+', '\bC\s+programming\b']}
- {name: "C#", category: language, aliases: ["c#", "csharp"]}
- {name: Go, category: language, aliases: [golang], regex: ['\b(?:in|with|using)\s+Go\b(?!\s+(?:to|live|ahead))', '\bGo\s*(?:,|/|and|or)\s*(?:Python|Java|Rust|C\+\+|Ruby|Kotlin|Scala|TypeScript|JavaScript|Node|SQL|Bash|PHP|Swift)\b', '\b(?:Python|Java|Rust|C\+\+|Ruby|Kotlin|Scala|TypeScript|JavaScript|Node(?:\.js)?|SQL|Bash|PHP|Swift)\s*(?:,|/|and|or)\s*Go\b(?!\s*-?\s*to)']}
- {name: Rust, category: language, aliases: [rust]}
- {name: Ruby, category: language, aliases: [ruby]}
- {name: PHP, category: language, aliases: [php]}
- {name: Swift, category: language, aliases: [swiftui], regex: ['\b(?:in|with|using)\s+Swift\b', '\bSwift\s*(?:,|/|and|or)\s*(?:Kotlin|Objective-C|Java|Python|Android|iOS)\b', '\b(?:Kotlin|Objective-C|Java|Python)\s*(?:,|/|and|or)\s*Swift\b', '\bSwift\s+(?:programming|developer|engineer|language)', '\b(?:iOS|Xcode|Apple|macOS)\b[^.]{0,60}\bSwift\b']}
- {name: Kotlin, category: language, aliases: [kotlin]}
- {name: Scala, category: language, aliases: [scala]}
- {name: R, category: language, regex: ['\bR\s+programming\b', '\bin\s+R\b', '\bR\s*(?:,|/)\s*(?:Python|SQL|SAS|Stata|MATLAB)\b', '\b(?:Python|SQL|SAS|Stata|MATLAB)\s*(?:,|/)\s*R\b', '\brstudio\b']}
- {name: SQL, category: language, aliases: [sql, t-sql, pl/sql]}
- {name: Bash, category: language, aliases: [bash, "shell scripting", "shell script"]}
- {name: MATLAB, category: language, aliases: [matlab]}
- {name: Julia, category: language, cs: [Julia]}
- {name: Dart, category: language, cs: [Dart]}
- {name: Perl, category: language, aliases: [perl]}
- {name: Haskell, category: language, aliases: [haskell]}
- {name: Elixir, category: language, aliases: [elixir]}
- {name: Lua, category: language, cs: [Lua]}
- {name: Objective-C, category: language, aliases: [objective-c, objc]}
- {name: Solidity, category: language, aliases: [solidity]}
- {name: SAS, category: language, cs: [SAS]}
- {name: Verilog, category: language, aliases: [verilog, systemverilog, vhdl]}

